<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a18">
  <title>梗一下 — 把你的梗变成一个小游戏</title>
  <meta name="description" content="输入生活中的一句梗或一段故事，立刻生成一个能玩、能分享的小游戏。">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- 加载顺序有依赖：schema/scenes 是共用定义，art-scenes 提供 v2 场景与素材，
       theme 负责路由到 art-scenes，modes 提供三种玩法引擎，qr 用于分享卡二维码。 -->
  <script src="/shared/schema.js"></script>
  <script src="/shared/scenes.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/art-scenes.js"></script>
  <script src="/js/audio.js"></script>
  <script src="/js/engine.js"></script>
  <script src="/js/modes.js"></script>
  <script src="/js/qr.js"></script>
  <script src="/js/static-api.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
